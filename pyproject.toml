[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-sentinel"
version = "0.1.0"
description = "A local-first detection engineering and incident investigation lab."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "No license selected yet; see docs/LICENSING.md" }
authors = [{ name = "SOC Sentinel contributors" }]
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0,<7",
]
dashboard = ["streamlit>=1.40,<2"]

[project.scripts]
soc-sentinel = "soc_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/soc_sentinel/db.py" = ["E501"]
"src/soc_sentinel/incidents.py" = ["E501"]
"src/soc_sentinel/dashboard.py" = ["E501"]
"src/soc_sentinel/dashboard_services.py" = ["E501"]
"tests/test_dashboard_services.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*", "pandas", "pandas.*", "numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
