# Exact entity equality; missing values never match. Require two shared values; transitivity is an explicit policy opt-in.
policy_id: default-local-v1
window_seconds: 1800
minimum_shared_entities: 2
allow_transitive: true
strategies:
  - same_username_and_source_ip
  - shared_event
  - same_host
  - same_username
  - same_source_ip
