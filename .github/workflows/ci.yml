name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard]"
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Verify formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src tests
      - name: Validate shipped detection rules
        if: matrix.python-version == '3.11'
        run: soc-sentinel validate-rules --rules rules/
      - name: Generate reproducible detection evaluation
        if: matrix.python-version == '3.11'
        run: soc-sentinel evaluate --dataset data/evaluation/benchmark.json --rules rules/ --output reports/evaluation/
      - name: Archive detection evaluation reports
        if: success() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: detection-evaluation-${{ github.sha }}
          path: reports/evaluation/
          if-no-files-found: error
          retention-days: 14
