name: Temporary Phase 4 quality fixer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install -e ".[dev]" autopep8
      - name: Apply mechanical fixes
        run: |
          autopep8 --in-place --select E701,E702             src/soc_sentinel/db.py
          ruff format .
          ruff check --fix .
      - name: Commit mechanical fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/soc_sentinel/cli.py src/soc_sentinel/correlation.py             src/soc_sentinel/db.py src/soc_sentinel/incident_cli.py             src/soc_sentinel/incidents.py tests/test_incidents.py             tests/test_incident_cli.py tests/test_db.py tests/test_storage.py
          if ! git diff --cached --quiet; then
            git commit -m "style: finish Phase 4 quality fixes"
            git push origin main
          fi
