name: Temporary Phase 4 formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project tools and Python formatter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" autopep8
      - name: Format Phase 4 files
        run: |
          autopep8 --in-place --select E701,E702 src/soc_sentinel/correlation.py             src/soc_sentinel/incidents.py             src/soc_sentinel/incident_cli.py             src/soc_sentinel/cli.py             tests/test_incidents.py             tests/test_incident_cli.py             tests/test_db.py             tests/test_storage.py
          ruff format .
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/soc_sentinel/correlation.py src/soc_sentinel/incidents.py             src/soc_sentinel/incident_cli.py src/soc_sentinel/cli.py             tests/test_incidents.py tests/test_incident_cli.py tests/test_db.py tests/test_storage.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format Phase 4 incident workflow"
            git push origin main
          fi
