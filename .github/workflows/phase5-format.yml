name: Temporary Phase 5 formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Format Phase 5 Python files
        run: |
          ruff format src/soc_sentinel/dashboard.py src/soc_sentinel/dashboard_services.py \
            src/soc_sentinel/demo.py src/soc_sentinel/cli.py src/soc_sentinel/incidents.py \
            tests/test_dashboard_services.py
          ruff check --fix .
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/soc_sentinel/dashboard.py src/soc_sentinel/dashboard_services.py \
            src/soc_sentinel/demo.py src/soc_sentinel/cli.py src/soc_sentinel/incidents.py \
            tests/test_dashboard_services.py
          if ! git diff --cached --quiet; then
            git commit -m "style(dashboard): format Phase 5 implementation"
            git push origin main
          fi
